apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-alert-rules
  namespace: default
data:
  alert-rules.yaml: |
    apiVersion: 1
    contactPoints:
    - orgId: 1
      name: main email
      receivers:
        - uid: fel6hwu9jiu4ge
          type: email
          settings:
            addresses: it21928@hua.gr
            singleEmail: false
          disableResolveMessage: true
    groups:
        - orgId: 1
          name: Capacity
          folder: Minio
          interval: 10m
          rules:
            - uid: ceje8ix1qk0zke
              title: MinIO Free Capacity
              condition: ' Threshold'
              data:
                - refId: Usable Free
                  relativeTimeRange:
                    from: 600
                    to: 0
                  datasourceUid: PBFA97CFB590B2093
                  model:
                    datasource:
                        type: prometheus
                        uid: PBFA97CFB590B2093
                    disableTextWrap: false
                    editorMode: builder
                    expr: minio_cluster_capacity_usable_free_bytes{job="minio-job-v2"}
                    fullMetaSearch: false
                    includeNullMetadata: true
                    instant: true
                    intervalMs: 1000
                    legendFormat: __auto
                    maxDataPoints: 43200
                    range: false
                    refId: Usable Free
                    useBackend: false
                - refId: Percentage Full
                  relativeTimeRange:
                    from: 600
                    to: 0
                  datasourceUid: PBFA97CFB590B2093
                  model:
                    datasource:
                        type: prometheus
                        uid: PBFA97CFB590B2093
                    disableTextWrap: false
                    editorMode: code
                    expr: (minio_cluster_capacity_usable_total_bytes{job="minio-job-v2"} - minio_cluster_capacity_usable_free_bytes{job="minio-job-v2"}) / minio_cluster_capacity_usable_total_bytes{job="minio-job-v2"}
                    fullMetaSearch: false
                    includeNullMetadata: true
                    instant: true
                    intervalMs: 1000
                    legendFormat: __auto
                    maxDataPoints: 43200
                    range: false
                    refId: Percentage Full
                    useBackend: false
                - refId: ' Threshold'
                  datasourceUid: __expr__
                  model:
                    conditions:
                        - evaluator:
                            params:
                                - 0.8
                            type: gt
                          operator:
                            type: and
                          query:
                            params:
                                - C
                          reducer:
                            params: []
                            type: last
                          type: query
                    datasource:
                        type: __expr__
                        uid: __expr__
                    expression: Percentage Full
                    intervalMs: 1000
                    maxDataPoints: 43200
                    refId: ' Threshold'
                    type: threshold
              noDataState: NoData
              execErrState: Error
              for: 10m
              annotations:
                summary: Capacity less than 20%
              isPaused: false
              notification_settings:
                receiver: main email

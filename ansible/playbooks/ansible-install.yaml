---
- hosts: control
  tasks:

  - name: Update package cache
    apt:
      update_cache: yes
    become: true

  - name: Install Python and pip
    apt:
      name: "{{ item }}"
      state: present
    become: true
    loop:
      - python3
      - python3-pip

  - name: Install Ansible
    apt:
      name: ansible
      state: present
    become: true

  - name: Install collections from requirements.yaml
    ansible.builtin.shell: ansible-galaxy install -r /home/vagrant/ansible/requirements.yaml
